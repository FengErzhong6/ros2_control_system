# `preview_fps` only limits the UI preview bridge topic.
# Driver capture fps comes from the selected profile in `orbbec_defaults.yaml`
# or `realsense_defaults.yaml`.
cameras:
  cam_left_wrist:
    driver: orbbec
    serial_number: "CPCBC5300064"
    frame_id: "cam_left_wrist_color_optical_frame"
    namespace: "cam_left_wrist"
    profile: "wrist_default"
    preview_topic: /cam_left_wrist/preview/image_raw
    preview_fps: 20.0
    record_topics:
      - /cam_left_wrist/image_raw

  cam_right_wrist:
    driver: orbbec
    serial_number: "CPCBC53000BJ"
    frame_id: "cam_right_wrist_color_optical_frame"
    namespace: "cam_right_wrist"
    profile: "wrist_default"
    preview_topic: /cam_right_wrist/preview/image_raw
    preview_fps: 20.0
    record_topics:
      - /cam_right_wrist/image_raw

  cam_high:
    driver: realsense
    serial_number: "348122071366"
    frame_id: "cam_high_color_optical_frame"
    namespace: "cam_high"
    profile: "high_default"
    preview_topic: /cam_high/preview/image_raw
    preview_fps: 20.0
    record_topics:
      - /cam_high/cam_high/color/image_raw
      - /cam_high/cam_high/color/camera_info
