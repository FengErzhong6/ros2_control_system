recipe_id: marvin_tracker_camera_mock_collection
devices:
  - id: cam_high
    adapter: camera
    required: true
    depends_on: []
    ready_timeout_sec: 10.0
    launch_arguments:
      use_mock_camera: true
      mock_publish_rate: 10.0
  - id: cam_left_wrist
    adapter: camera
    required: true
    depends_on: []
    ready_timeout_sec: 10.0
    launch_arguments:
      use_mock_camera: true
      mock_publish_rate: 10.0
  - id: cam_right_wrist
    adapter: camera
    required: true
    depends_on: []
    ready_timeout_sec: 10.0
    launch_arguments:
      use_mock_camera: true
      mock_publish_rate: 10.0
  - id: htc_tracker
    adapter: htc
    required: true
    depends_on: []
    ready_timeout_sec: 10.0
    launch_arguments:
      use_mock_trackers: true
      mock_publish_rate: 60.0
  - id: marvin_dual
    adapter: marvin
    required: true
    depends_on:
      - htc_tracker
    ready_timeout_sec: 30.0
    launch_arguments:
      gui: false
      use_mock_hardware: true
      use_keyboard_gate: false
      start_tracker_publisher: false
      start_cameras: false
      show_camera_views: false
record_topics:
  - /cam_high/cam_high/color/image_raw
  - /cam_high/cam_high/color/camera_info
  - /cam_left_wrist/image_raw
  - /cam_right_wrist/image_raw
  - /joint_states
  - /tf
  - /tf_static
