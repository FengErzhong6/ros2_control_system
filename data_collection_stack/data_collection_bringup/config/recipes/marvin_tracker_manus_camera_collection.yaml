recipe_id: marvin_tracker_manus_camera_collection
devices:
  - id: cam_high
    adapter: camera
    required: true
    depends_on: []
    ready_timeout_sec: 15.0
    startup_no_image_restart_timeout_sec: 12.0
    use_managed_launch: true
  - id: cam_left_wrist
    adapter: camera
    required: true
    depends_on: []
    ready_timeout_sec: 15.0
    use_managed_launch: true
  - id: cam_right_wrist
    adapter: camera
    required: true
    depends_on: []
    ready_timeout_sec: 15.0
    use_managed_launch: true
  - id: htc_tracker
    adapter: htc
    required: true
    depends_on: []
    use_managed_launch: true
  - id: manus_glove
    adapter: manus
    required: true
    depends_on: []
    use_managed_launch: true
  - id: marvin_dual
    adapter: marvin
    required: true
    depends_on:
      - htc_tracker
      - manus_glove
    use_managed_launch: true
    ready_timeout_sec: 45.0
    launch_arguments:
      use_gripper_L: true
      use_gripper_R: true
      start_manus_gripper_bridge: true
record_topics:
  - /cam_high/cam_high/color/image_raw
  - /cam_high/cam_high/color/camera_info
  - /cam_left_wrist/image_raw
  - /cam_right_wrist/image_raw
  - /joint_states
  - /manus_raw_publisher_node/gloves_raw
  - /tf
  - /tf_static
